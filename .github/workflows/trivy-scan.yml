name: Trivy Image Scan

on:
  workflow_dispatch:

  # Optional: Run automatically when code is pushed.
  # push:
  #   branches:
  #     - main
  #     - feature/trivy

permissions:
  contents: read
  id-token: write

env:
  # AWS and ECR configuration
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "222634402470"
  ECR_REGISTRY: "222634402470.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_REPOSITORY: "te_dev_frontend"

  # Change this if the image uses another tag
  IMAGE_TAG: "75150b2"

  # Trivy scanner container
  TRIVY_IMAGE: "aquasec/trivy:0.76.1"

jobs:
  trivy-image-scan:
    name: Scan te_dev_frontend ECR Image
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Step 1: Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl --silent --show-error --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${RESPONSE}" | jq -r '.value')

          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi

          PAYLOAD=$(echo "${TOKEN}" | cut -d '.' -f 2)

          python3 - "${PAYLOAD}" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          safe_claims = {
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get(
                  "repository_owner_id"
              ),
              "ref": claims.get("ref"),
              "environment": claims.get("environment"),
              "event_name": claims.get("event_name"),
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      # ---------------------------------------------------------
      # Step 2: Authenticate to AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # Step 3: Login Docker to the private Amazon ECR registry
      # ---------------------------------------------------------
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------
      # Step 4: Prepare directories and pull Trivy
      # ---------------------------------------------------------
      - name: Prepare scan environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== PREPARING SCAN ENVIRONMENT =========="

          mkdir -p reports/UI
          mkdir -p .trivy-cache

          echo "Docker version:"
          docker --version

          echo "Python version:"
          python3 --version

          echo "Pulling Trivy scanner image: ${TRIVY_IMAGE}"
          docker pull "${TRIVY_IMAGE}"

      # ---------------------------------------------------------
      # Step 5: Construct the complete ECR image URI
      # ---------------------------------------------------------
      - name: Configure UI image URI
        id: image
        shell: bash
        run: |
          set -euo pipefail

          UI_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          if [ -z "${UI_IMAGE}" ]; then
            echo "::error::Frontend image URI is empty."
            exit 1
          fi

          echo "UI_image=${UI_IMAGE}" >> "${GITHUB_OUTPUT}"

          echo "========== IMAGE CONFIGURATION =========="
          echo "AWS region     : ${AWS_REGION}"
          echo "AWS account    : ${AWS_ACCOUNT_ID}"
          echo "ECR registry   : ${ECR_REGISTRY}"
          echo "ECR repository : ${ECR_REPOSITORY}"
          echo "Image tag      : ${IMAGE_TAG}"
          echo "Complete image : ${UI_IMAGE}"
          echo "Trivy image    : ${TRIVY_IMAGE}"

      # ---------------------------------------------------------
      # Step 6: Verify the image tag exists in ECR
      # ---------------------------------------------------------
      - name: Verify image exists in Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking whether image tag '${IMAGE_TAG}' exists..."

          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].{
              Digest:imageDigest,
              Tag:imageTags[0],
              PushedAt:imagePushedAt,
              Size:imageSizeInBytes
            }' \
            --output table

      # ---------------------------------------------------------
      # Step 7: Pull UI image from Amazon ECR
      # ---------------------------------------------------------
      - name: Pull UI image from Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          UI_IMAGE="${{ steps.image.outputs.UI_image }}"

          echo "========== PULLING UI IMAGE =========="
          echo "Image: ${UI_IMAGE}"

          docker pull "${UI_IMAGE}"

          echo ""
          echo "========== VERIFYING PULLED IMAGE =========="

          docker image inspect \
            "${UI_IMAGE}" \
            --format='Image ID: {{.Id}}'

          docker image inspect \
            "${UI_IMAGE}" \
            --format='Created: {{.Created}}'

          docker image inspect \
            "${UI_IMAGE}" \
            --format='Architecture: {{.Architecture}}'

      # ---------------------------------------------------------
      # Step 8: Scan image and produce JSON report
      # ---------------------------------------------------------
      - name: Generate Trivy scan reports
        shell: bash
        run: |
          set -euo pipefail

          UI_IMAGE="${{ steps.image.outputs.UI_image }}"
          REPORT_DIR="${GITHUB_WORKSPACE}/reports/UI"

          mkdir -p "${REPORT_DIR}"

          rm -f \
            "${REPORT_DIR}/trivy-results.json" \
            "${REPORT_DIR}/trivy-all-results.txt" \
            "${REPORT_DIR}/trivy-high-critical.txt"

          echo "=========================================="
          echo "SCANNING IMAGE"
          echo "${UI_IMAGE}"
          echo "=========================================="

          echo "Generating complete JSON report..."

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${REPORT_DIR}:/reports" \
            -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            --output /reports/trivy-results.json \
            "${UI_IMAGE}"

          echo "Validating JSON report..."

          test -s "${REPORT_DIR}/trivy-results.json"

          python3 -m json.tool \
            "${REPORT_DIR}/trivy-results.json" > /dev/null

          echo "Generating complete TXT report..."

          docker run --rm \
            -v "${REPORT_DIR}:/reports" \
            -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            convert \
            --scanners vuln \
            --format table \
            --output /reports/trivy-all-results.txt \
            /reports/trivy-results.json

          echo "Generating HIGH and CRITICAL TXT report..."

          docker run --rm \
            -v "${REPORT_DIR}:/reports" \
            -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            convert \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --output /reports/trivy-high-critical.txt \
            /reports/trivy-results.json

          test -s "${REPORT_DIR}/trivy-all-results.txt"
          test -s "${REPORT_DIR}/trivy-high-critical.txt"

          echo "Reports generated successfully."

          ls -lh "${REPORT_DIR}"

      - name: Upload Trivy scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-dev-UI-trivy-reports-${{ github.run_number }}
          path: ${{ github.workspace }}/reports/
          if-no-files-found: error
          

name: Trivy ECR Image Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 222634402470.dkr.ecr.ap-south-1.amazonaws.com

  UI_ECR_REPOSITORY: te_dev_frontend
  API_ECR_REPOSITORY: te_dev_api

  UI_IMAGE_TAG: 75150b2
  API_IMAGE_TAG: latest

  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  trivy-image-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare Environment
        run: |
          mkdir -p reports/UI
          mkdir -p reports/API
          mkdir -p templates
          mkdir -p .trivy-cache

          docker pull "${TRIVY_IMAGE}"

      - name: Download HTML Template
        run: |
          curl -sSL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o templates/html.tpl

      - name: Configure Image URIs
        id: image
        run: |
          UI_IMAGE="${ECR_REGISTRY}/${UI_ECR_REPOSITORY}:${UI_IMAGE_TAG}"
          API_IMAGE="${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${API_IMAGE_TAG}"

          echo "ui_image=${UI_IMAGE}" >> $GITHUB_OUTPUT
          echo "api_image=${API_IMAGE}" >> $GITHUB_OUTPUT

      - name: Verify UI Image
        run: |
          aws ecr describe-images \
            --repository-name "${UI_ECR_REPOSITORY}" \
            --image-ids imageTag="${UI_IMAGE_TAG}"

      - name: Verify API Image
        run: |
          aws ecr describe-images \
            --repository-name "${API_ECR_REPOSITORY}" \
            --image-ids imageTag="${API_IMAGE_TAG}"

      - name: Pull UI Image
        run: |
          docker pull "${{ steps.image.outputs.ui_image }}"

      - name: Pull API Image
        run: |
          docker pull "${{ steps.image.outputs.api_image }}"

      - name: Scan Images and Generate Reports
        shell: bash
        run: |
          set -euo pipefail

          scan_image() {

            NAME="$1"
            IMAGE="$2"

            REPORT_DIR="${GITHUB_WORKSPACE}/reports/${NAME}"

            echo "===================================="
            echo "Scanning ${NAME}"
            echo "Image: ${IMAGE}"
            echo "===================================="

            ####################################################
            # JSON REPORT
            ####################################################

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${REPORT_DIR}:/reports" \
              -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image \
              --image-src docker \
              --scanners vuln \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format json \
              --output /reports/trivy-results.json \
              "${IMAGE}"

            ####################################################
            # FULL TXT REPORT
            ####################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              "${TRIVY_IMAGE}" convert \
              --format table \
              --output /reports/trivy-all-results.txt \
              /reports/trivy-results.json

            ####################################################
            # HIGH + CRITICAL TXT REPORT
            ####################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              "${TRIVY_IMAGE}" convert \
              --severity HIGH,CRITICAL \
              --format table \
              --output /reports/trivy-high-critical.txt \
              /reports/trivy-results.json

            ####################################################
            # HTML REPORT
            ####################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              -v "${GITHUB_WORKSPACE}/templates:/templates" \
              "${TRIVY_IMAGE}" convert \
              --format template \
              --template "@/templates/html.tpl" \
              --output /reports/trivy-report.html \
              /reports/trivy-results.json

            ####################################################
            # SECURITY GATE
            ####################################################
            echo "Running security gate..."

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image \
              --image-src docker \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --no-progress \
              "${IMAGE}"

            echo "Security gate passed for ${NAME}"
          }

          scan_image "UI" "${{ steps.image.outputs.ui_image }}"
          scan_image "API" "${{ steps.image.outputs.api_image }}"

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: error

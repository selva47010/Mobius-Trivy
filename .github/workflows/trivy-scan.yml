name: Trivy ECR Image Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "222634402470"
  ECR_REGISTRY: "222634402470.dkr.ecr.ap-south-1.amazonaws.com"

  UI_ECR_REPOSITORY: "te_dev_frontend"
  API_ECR_REPOSITORY: "te_dev_api"

  IMAGE_TAG: "75150b2"

  TRIVY_IMAGE: "aquasec/trivy:0.76.1"

jobs:
  trivy-image-scan:
    name: Scan UI and API Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################################
      # OIDC Debug (Optional)
      ######################################################################
      - name: Display GitHub OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --silent --show-error --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${RESPONSE}" | jq -r '.value')

          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi

          PAYLOAD=$(echo "${TOKEN}" | cut -d '.' -f 2)

          python3 - "${PAYLOAD}" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          safe_claims = {
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "repository_owner": claims.get("repository_owner"),
              "ref": claims.get("ref"),
              "event_name": claims.get("event_name"),
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      ######################################################################
      # Authenticate AWS
      ######################################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      ######################################################################
      # Login ECR
      ######################################################################
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      ######################################################################
      # Prepare Environment
      ######################################################################
      - name: Prepare Scan Environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/UI
          mkdir -p reports/API
          mkdir -p templates
          mkdir -p .trivy-cache

          docker --version
          python3 --version

          echo "Pulling Trivy image..."
          docker pull "${TRIVY_IMAGE}"

      ######################################################################
      # Download Trivy HTML Template
      ######################################################################
      - name: Download HTML Template
        shell: bash
        run: |
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o templates/html.tpl

          ls -l templates/html.tpl

      ######################################################################
      # Build Image URIs
      ######################################################################
      - name: Configure Image URIs
        id: image
        shell: bash
        run: |
          set -euo pipefail

          UI_IMAGE="${ECR_REGISTRY}/${UI_ECR_REPOSITORY}:${IMAGE_TAG}"
          API_IMAGE="${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "ui_image=${UI_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "UI  Image: ${UI_IMAGE}"
          echo "API Image: ${API_IMAGE}"

      ######################################################################
      # Verify UI Image
      ######################################################################
      - name: Verify UI Image Exists
        shell: bash
        run: |
          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${UI_ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --output table

      ######################################################################
      # Verify API Image
      ######################################################################
      - name: Verify API Image Exists
        shell: bash
        run: |
          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${API_ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --output table

      ######################################################################
      # Pull UI Image
      ######################################################################
      - name: Pull UI Image
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.ui_image }}"

      ######################################################################
      # Pull API Image
      ######################################################################
      - name: Pull API Image
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.api_image }}"

      ######################################################################
      # Scan Images
      ######################################################################
      - name: Generate Trivy Reports
        shell: bash
        run: |
          set -euo pipefail

          scan_image () {

            NAME="$1"
            IMAGE="$2"

            REPORT_DIR="${GITHUB_WORKSPACE}/reports/${NAME}"

            mkdir -p "${REPORT_DIR}"

            echo "============================================================"
            echo "Scanning ${NAME}"
            echo "Image: ${IMAGE}"
            echo "============================================================"

            ########################################################
            # JSON REPORT
            ########################################################

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${REPORT_DIR}:/reports" \
              -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image \
              --image-src docker \
              --scanners vuln \
              --pkg-types os,library \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --exit-code 0 \
              --format json \
              --output /reports/trivy-results.json \
              "${IMAGE}"

            test -s "${REPORT_DIR}/trivy-results.json"

            ########################################################
            # VALIDATE JSON
            ########################################################

            python3 -m json.tool \
              "${REPORT_DIR}/trivy-results.json" > /dev/null

            ########################################################
            # FULL TXT REPORT
            ########################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              "${TRIVY_IMAGE}" convert \
              --format table \
              --output /reports/trivy-all-results.txt \
              /reports/trivy-results.json

            ########################################################
            # HIGH & CRITICAL TXT REPORT
            ########################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              "${TRIVY_IMAGE}" convert \
              --severity HIGH,CRITICAL \
              --format table \
              --output /reports/trivy-high-critical.txt \
              /reports/trivy-results.json

            ########################################################
            # HTML REPORT
            ########################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              -v "${GITHUB_WORKSPACE}/templates:/templates" \
              "${TRIVY_IMAGE}" convert \
              --format template \
              --template "@/templates/html.tpl" \
              --output /reports/trivy-report.html \
              /reports/trivy-results.json

            echo ""
            echo "Generated files:"
            ls -lh "${REPORT_DIR}"
            echo ""
          }

          scan_image "UI"  "${{ steps.image.outputs.ui_image }}"
          scan_image "API" "${{ steps.image.outputs.api_image }}"

      ######################################################################
      # Summary
      ######################################################################
      - name: Scan Summary
        if: always()
        shell: bash
        run: |
          echo "Generated Reports"
          echo "-----------------"

          find reports -type f | sort

      ######################################################################
      # Upload Artifacts
      ######################################################################
      - name: Upload Trivy Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-dev-trivy-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

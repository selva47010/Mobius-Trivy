name: Trivy ECR Image Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "222634402470"
  ECR_REGISTRY: "222634402470.dkr.ecr.ap-south-1.amazonaws.com"

  UI_ECR_REPOSITORY: "te_dev_frontend"
  API_ECR_REPOSITORY: "te_dev_api"

  UI_IMAGE_TAG: "75150b2"
  API_IMAGE_TAG: "latest"

  TRIVY_IMAGE: "aquasec/trivy:0.76.1"

jobs:
  trivy-image-scan:
    name: Scan UI and API Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #####################################################################
      # Configure AWS Credentials
      #####################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #####################################################################
      # Login to Amazon ECR
      #####################################################################

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      #####################################################################
      # Prepare Environment
      #####################################################################

      - name: Prepare Scan Environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/UI
          mkdir -p reports/API
          mkdir -p templates
          mkdir -p .trivy-cache

          docker --version
          python3 --version

          docker pull "${TRIVY_IMAGE}"

      #####################################################################
      # Download Trivy HTML Template
      #####################################################################

      - name: Download Trivy HTML Template
        run: |
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o templates/html.tpl

      #####################################################################
      # Construct Image URIs
      #####################################################################

      - name: Configure Image URIs
        id: image
        shell: bash
        run: |
          set -euo pipefail

          UI_IMAGE="${ECR_REGISTRY}/${UI_ECR_REPOSITORY}:${UI_IMAGE_TAG}"
          API_IMAGE="${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${API_IMAGE_TAG}"

          echo "ui_image=${UI_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "UI Image  : ${UI_IMAGE}"
          echo "API Image : ${API_IMAGE}"

      #####################################################################
      # Verify UI Image Exists
      #####################################################################

      - name: Verify UI Image Exists
        shell: bash
        run: |
          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${UI_ECR_REPOSITORY}" \
            --image-ids imageTag="${UI_IMAGE_TAG}" \
            --query 'imageDetails[0].{
              Digest:imageDigest,
              Tag:imageTags[0],
              PushedAt:imagePushedAt,
              Size:imageSizeInBytes
            }' \
            --output table

      #####################################################################
      # Verify API Image Exists
      #####################################################################

      - name: Verify API Image Exists
        shell: bash
        run: |
          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${API_ECR_REPOSITORY}" \
            --image-ids imageTag="${API_IMAGE_TAG}" \
            --query 'imageDetails[0].{
              Digest:imageDigest,
              Tag:imageTags[0],
              PushedAt:imagePushedAt,
              Size:imageSizeInBytes
            }' \
            --output table

      #####################################################################
      # Pull UI Image
      #####################################################################

      - name: Pull UI Image
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.ui_image }}"

      #####################################################################
      # Pull API Image
      #####################################################################

      - name: Pull API Image
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.api_image }}"

      #####################################################################
      # Generate Trivy Reports
      #####################################################################

      - name: Generate Trivy Reports
        shell: bash
        run: |
          set -euo pipefail

          scan_image() {

            NAME="$1"
            IMAGE="$2"

            REPORT_DIR="${GITHUB_WORKSPACE}/reports/${NAME}"

            mkdir -p "${REPORT_DIR}"

            echo "================================================="
            echo "Scanning ${NAME}"
            echo "Image : ${IMAGE}"
            echo "================================================="

            ####################################################
            # JSON REPORT
            ####################################################

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${REPORT_DIR}:/reports" \
              -v "${GITHUB_WORKSPACE}/.trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" image \
              --image-src docker \
              --scanners vuln \
              --pkg-types os,library \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --exit-code 0 \
              --format json \
              --output /reports/trivy-results.json \
              "${IMAGE}"

            ####################################################
            # Validate JSON
            ####################################################

            test -s "${REPORT_DIR}/trivy-results.json"

            python3 -m json.tool \
              "${REPORT_DIR}/trivy-results.json" > /dev/null

            ####################################################
            # FULL TXT REPORT
            ####################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              "${TRIVY_IMAGE}" convert \
              --format table \
              --output /reports/trivy-all-results.txt \
              /reports/trivy-results.json

            ####################################################
            # HIGH + CRITICAL REPORT
            ####################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              "${TRIVY_IMAGE}" convert \
              --severity HIGH,CRITICAL \
              --format table \
              --output /reports/trivy-high-critical.txt \
              /reports/trivy-results.json

            ####################################################
            # HTML REPORT
            ####################################################

            docker run --rm \
              -v "${REPORT_DIR}:/reports" \
              -v "${GITHUB_WORKSPACE}/templates:/templates" \
              "${TRIVY_IMAGE}" convert \
              --format template \
              --template "@/templates/html.tpl" \
              --output /reports/trivy-report.html \
              /reports/trivy-results.json

            echo ""
            echo "Generated Reports:"
            ls -lh "${REPORT_DIR}"
            echo ""
          }

          scan_image "UI" "${{ steps.image.outputs.ui_image }}"
          scan_image "API" "${{ steps.image.outputs.api_image }}"

      #####################################################################
      # Scan Summary
      #####################################################################

      - name: Report Summary
        if: always()
        run: |
          echo "Generated Files"
          find reports -type f | sort

      #####################################################################
      # Upload Artifacts
      #####################################################################

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
